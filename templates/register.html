<div class="form-container">
  <h1>Register</h1>
  <div id="register-error" class="error-message"></div>
  <div class="form-group">
    <label for="register-username">Username</label>
    <input id="register-username" class="form-input" placeholder="Choose a username" autocomplete="username">
  </div>
  <div class="form-group">
    <label for="register-password">Password</label>
    <input id="register-password" type="password" class="form-input" placeholder="Choose a password" autocomplete="new-password">
  </div>
  <button onclick="doRegister()" class="btn btn-primary btn-block">Register</button>
  <p class="form-footer">Already have an account? <a href="/login">Login</a></p>
</div>
