<div class="form-container">
  <h1>注册</h1>
  <div id="register-error" class="error-message"></div>
  <div class="form-group">
    <label for="register-username">用户名</label>
    <input id="register-username" class="form-input" placeholder="请设置用户名" autocomplete="username">
  </div>
  <div class="form-group">
    <label for="register-password">密码</label>
    <input id="register-password" type="password" class="form-input" placeholder="请设置密码" autocomplete="new-password">
  </div>
  <button onclick="doRegister()" class="btn btn-primary btn-block">注册</button>
  <p class="form-footer">已有账号？<a href="/login">去登录</a></p>
</div>
