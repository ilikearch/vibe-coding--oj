<section class="hero">
  <h1>Vibe OJ</h1>
  <p class="hero-tagline">面向小团队的轻量级 C++ 在线判题系统。<br>安全沙箱执行，实时判题反馈。</p>
  <div class="hero-cta">
    <a href="/problems" class="btn btn-primary">浏览题目</a>
    <a href="/register" class="btn btn-secondary">注册</a>
    <a href="/login" class="btn btn-secondary">登录</a>
  </div>
</section>

    <div class="feature-card">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-primary);margin-bottom:12px"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      <h3>C++ 判题</h3>
      <p>提交 g++ 代码，基于 stdin/stdout 比对自动判定。</p>
    </div>
    <div class="feature-card">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-primary);margin-bottom:12px"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>

    <div class="feature-card">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-primary);margin-bottom:12px"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>

    <div class="feature-card">

      <p>在线管理题目和测试用例。</p>

  </div>

<section class="stats">
  <h2>平台统计</h2>
  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-value">{{PROBLEM_COUNT}}</span>
      <span class="stat-label">题目数</span>
    </div>
    <div class="stat-card">
      <span class="stat-value">{{USER_COUNT}}</span>
      <span class="stat-label">用户数</span>
