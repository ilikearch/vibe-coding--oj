<section class="hero">
  <h1>Vibe OJ</h1>
  <p class="hero-tagline">面向小团队的轻量级 C++ 在线判题系统。</p>
  <div class="hero-cta">
    <a href="/problems" class="btn btn-primary">浏览题目</a>
    <a href="/register" class="btn btn-secondary">注册</a>
    <a href="/login" class="btn btn-secondary">登录</a>
  </div>
</section>

<section class="features">
  <h2>特色功能</h2>
  <div class="feature-grid">
    <div class="feature-card">
      <h3>C++ 判题</h3>
      <p>提交 g++ 代码，基于 stdin/stdout 比对自动判定。</p>
    </div>
    <div class="feature-card">
      <h3>沙箱执行</h3>
      <p>rlimit + seccomp + chroot 三层安全隔离。</p>
    </div>
    <div class="feature-card">
      <h3>简易认证</h3>
      <p>注册、登录，bcrypt 密码哈希保护。</p>
    </div>
    <div class="feature-card">
      <h3>管理后台</h3>
      <p>在线管理题目和测试用例。</p>
    </div>
  </div>
</section>

<section class="stats">
  <h2>平台统计</h2>
  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-value">{{PROBLEM_COUNT}}</span>
      <span class="stat-label">题目数</span>
    </div>
    <div class="stat-card">
      <span class="stat-value">{{USER_COUNT}}</span>
      <span class="stat-label">用户数</span>
    </div>
  </div>
</section>
