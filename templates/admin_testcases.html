<h1>Test Cases for {{PROBLEM_TITLE}}</h1>
<p><a href="/admin">Back to Admin</a></p>

<h2>Add Test Case</h2>
<div id="tc-result" class="error-message"></div>
<div class="form-group">
  <label for="tc-input">Input (stdin)</label>
  <textarea id="tc-input" class="form-textarea" rows="4"></textarea>
</div>
<div class="form-group">
  <label for="tc-expected">Expected Output (stdout)</label>
  <textarea id="tc-expected" class="form-textarea" rows="4"></textarea>
</div>
<div class="form-group">
  <label for="tc-position">Position</label>
  <input id="tc-position" type="number" class="form-input" value="0" style="width:100px">
</div>
<button onclick="addTestCase({{PROBLEM_ID}})" class="btn btn-primary">Add Test Case</button>

<h2>Test Cases</h2>
<table class="table">
  <thead>
    <tr><th>ID</th><th>Pos</th><th>Input</th><th>Expected</th><th>Action</th></tr>
  </thead>
  <tbody>
    {{TESTCASE_ROWS}}
  </tbody>
</table>
