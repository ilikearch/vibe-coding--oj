<div class="form-container">
  <h1>登录</h1>
  <div id="login-error" class="error-message"></div>
  <div class="form-group">
    <label for="login-username">用户名</label>
    <input id="login-username" class="form-input" placeholder="请输入用户名" autocomplete="username">
  </div>
  <div class="form-group">
    <label for="login-password">密码</label>
    <input id="login-password" type="password" class="form-input" placeholder="请输入密码" autocomplete="current-password">
  </div>
  <button onclick="doLogin()" class="btn btn-primary btn-block">登录</button>
  <p class="form-footer">还没有账号？<a href="/register">立即注册</a></p>
</div>
