<div class="form-container">
  <h1>Login</h1>
  <div id="login-error" class="error-message"></div>
  <div class="form-group">
    <label for="login-username">Username</label>
    <input id="login-username" class="form-input" placeholder="Enter username" autocomplete="username">
  </div>
  <div class="form-group">
    <label for="login-password">Password</label>
    <input id="login-password" type="password" class="form-input" placeholder="Enter password" autocomplete="current-password">
  </div>
  <button onclick="doLogin()" class="btn btn-primary btn-block">Login</button>
  <p class="form-footer">Don't have an account? <a href="/register">Register</a></p>
</div>
