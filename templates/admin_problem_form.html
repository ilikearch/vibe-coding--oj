<h1>{{TITLE}} Problem</h1>
<div id="form-result" class="error-message"></div>
<div class="form-group">
  <label for="prob-title">Title</label>
  <input id="prob-title" class="form-input" value="{{TITLE_VALUE}}" required>
</div>
<div class="form-group">
  <label for="prob-difficulty">Difficulty</label>
  <select id="prob-difficulty" class="form-input">{{DIFFICULTY_OPTIONS}}</select>
</div>
<div class="form-group">
  <label for="prob-content">Description (Markdown)</label>
  <textarea id="prob-content" class="form-textarea" rows="10">{{CONTENT}}</textarea>
</div>
<div class="form-group">
  <label for="prob-template">Code Template (optional)</label>
  <textarea id="prob-template" class="form-textarea" rows="6">{{TEMPLATE}}</textarea>
</div>
<button onclick="{{SUBMIT_FN}}({{ID}})" class="btn btn-primary">{{SUBMIT_LABEL}}</button>
<p style="margin-top:16px"><a href="/admin">Back to Admin</a></p>
